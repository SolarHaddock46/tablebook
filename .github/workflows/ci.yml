name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tablebook
          POSTGRES_USER: tablebook
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://tablebook:password@localhost:5432/tablebook
      AUTH_SECRET: ci-test-secret
      ALLOWED_ORIGINS: http://localhost:8081

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      - run: pnpm db:migrate

      - run: pnpm test

      - run: pnpm --filter @tablebook/api build

      - run: pnpm --filter @tablebook/mobile build
